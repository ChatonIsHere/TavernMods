name: Validate submissions

# Checks each submission PR and posts the result as a PR comment.
#
# Runs on pull_request_target so a fork PR gets VIRUSTOTAL_API_KEY and a token
# that can comment. That is only safe because nothing from the PR executes:
# the checkout is main, only the PR's submissions/ is overlaid, and the
# downloader refuses non-https URLs and non-public hosts, at every redirect.

on:
  pull_request_target:
    paths:
      - "submissions/**"
      - "replacements.json"

permissions:
  contents: read
  pull-requests: write
  checks: write    # one check run per part of the validation, beside this job's own

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require a fork PR to add exactly one submission file
        id: shape
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const isFork = pr.head.repo && pr.head.repo.full_name !== pr.base.repo.full_name;
            core.setOutput('fork', isFork ? 'true' : 'false');
            if (!isFork) {
              core.setOutput('ok', 'true');
              return;
            }
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const problems = [];
            const added = files.filter(f => f.status === 'added');
            if (files.length !== 1 || added.length !== 1) {
              problems.push(
                'A submission PR must add exactly one file and change nothing else. ' +
                'This PR touches ' + files.length + ' file(s): ' +
                files.map(f => f.filename + ' (' + f.status + ')').join(', ') + '.');
            }
            const pathRe = /^submissions\/[^/]+\/\d+\.\d+\.\d+\.json$/;
            for (const f of added) {
              if (!pathRe.test(f.filename)) {
                problems.push(f.filename + ' is not a valid submission path. Expected ' +
                  'submissions/<owner>.<repo>/<version>.json.');
              }
            }
            if (problems.length) {
              require('fs').writeFileSync('shape-problems.txt', problems.join('\n') + '\n');
              core.setOutput('ok', 'false');
            } else {
              core.setOutput('ok', 'true');
              core.setOutput('file', added[0].filename);
            }

      - name: Overlay the PR's submissions/ and replacements.json onto main
        if: steps.shape.outputs.ok == 'true'
        env:
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/head
          IS_FORK: ${{ steps.shape.outputs.fork }}
        # A fork can't change replacements.json (the shape check above) and may
        # be branched from an older main, so it is checked against main's copy.
        run: |
          git fetch --no-tags --depth=1 origin "$PR_REF"
          git checkout FETCH_HEAD -- submissions
          if [ "$IS_FORK" != "true" ]; then
            if git cat-file -e FETCH_HEAD:replacements.json 2>/dev/null; then
              git checkout FETCH_HEAD -- replacements.json
            else
              rm -f replacements.json
            fi
          fi

      - name: Check who opened the PR (a fork PR must come from someone who works on the mod)
        id: owner
        if: steps.shape.outputs.ok == 'true'
        uses: actions/github-script@v9
        env:
          FILE: ${{ steps.shape.outputs.file }}
          IS_FORK: ${{ steps.shape.outputs.fork }}
        # The submission is only read as data. A maintainer can still merge a PR this blocks. Either way the PR
        # comment says who opened it.
        with:
          script: |
            const fs = require('fs');
            const who = context.payload.pull_request.user.login;
            const note = (text) => fs.writeFileSync('submitter.txt', text + '\n');
            if (process.env.IS_FORK !== 'true') {
              note(`Opened by ${who} from a branch of this repo, which only maintainers can push to, so who submitted it isn't checked.`);
              return;
            }
            const same = (a, b) => typeof a === 'string' && typeof b === 'string' && a.toLowerCase() === b.toLowerCase();
            let m;
            try { m = JSON.parse(fs.readFileSync(process.env.FILE, 'utf8')); } catch { return; }   // validate reports it
            const id = typeof m.id === 'string' ? m.id : '';
            const owner = id.split('.')[0], repo = id.slice(owner.length + 1);
            if (!/^[A-Za-z0-9-]+$/.test(owner) || !/^[A-Za-z0-9._-]+$/.test(repo)) return;   // validate reports it

            // Why who may submit it, or null.
            const allowed = async () => {
              if (same(who, owner)) return "the mod's owner";
              // Publishing a release needs write access to the repo.
              const tags = new Set();
              for (const a of Array.isArray(m.artifacts) ? m.artifacts : []) {
                const p = typeof a?.download_url === 'string' && a.download_url.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/releases\/download\/([^/]+)\//);
                if (p && same(p[1], owner) && same(p[2], repo)) tags.add(decodeURIComponent(p[3]));
              }
              for (const tag of [...tags].slice(0, 5)) {
                try {
                  const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                  if (same(data.author?.login, who)) return `who published its ${tag} release`;
                } catch (e) { if (e.status !== 404) throw e; }
              }
              try {
                await github.request('GET /orgs/{org}/public_members/{username}', { org: owner, username: who });
                return `a public member of ${owner}`;
              } catch (e) { if (e.status !== 404) throw e; }
              try {
                for await (const { data } of github.paginate.iterator(github.rest.repos.listContributors, { owner, repo, per_page: 100 })) {
                  if (data.some((c) => same(c.login, who))) return `a contributor to ${owner}/${repo}`;
                }
              } catch (e) { if (e.status !== 404) throw e; }
              return null;
            };

            let problem = null;
            try {
              const why = await allowed();
              if (why) note(`Opened by ${who}, ${why}.`);
              else {
                problem = `${who} opened this PR but isn't ${owner}, the publisher of one of its releases, a public member of ` +
                  `${owner} or a contributor to ${owner}/${repo}. Ask the mod's owner to submit it. A maintainer can still ` +
                  `merge it after checking the owner agrees.`;
              }
            } catch (e) {
              problem = `Couldn't check who may submit ${id} (${e.message}). Re-run the check.`;
            }
            if (problem) {
              fs.writeFileSync('owner-problems.txt', problem + '\n');
              core.setOutput('ok', 'false');
            }

      - uses: actions/setup-python@v7
        if: steps.shape.outputs.ok == 'true'
        with:
          python-version: "3.x"

      - name: Validate
        id: validate
        if: steps.shape.outputs.ok == 'true'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_MAX_PER_MINUTE: ${{ vars.VT_MAX_PER_MINUTE }}
          VT_MAX_MALICIOUS: ${{ vars.VT_MAX_MALICIOUS }}
        # Never fails here so the comment step runs; the last step fails the check.
        run: |
          set +e
          python tools/modindex.py validate --require-vt --vt-max-malicious "${VT_MAX_MALICIOUS:-0}" --report report.json \
            > validate-output.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat validate-output.txt

      - name: Post or update the PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- modindex-validation -->';
            let head, details = '';
            if (fs.existsSync('shape-problems.txt')) {
              const probs = fs.readFileSync('shape-problems.txt', 'utf8').trim().split('\n');
              head = '## Submission checks: FAILED\n\n' + probs.map(p => '- ' + p).join('\n');
            } else {
              const rc = '${{ steps.validate.outputs.rc }}';
              // A backtick run from a submitted URL can't close the fence.
              const output = (fs.existsSync('validate-output.txt')
                ? fs.readFileSync('validate-output.txt', 'utf8') : '(no output)').replace(/`/g, "'");
              const owner = fs.existsSync('owner-problems.txt') ? fs.readFileSync('owner-problems.txt', 'utf8').trim() : '';
              const submitter = fs.existsSync('submitter.txt') ? ' ' + fs.readFileSync('submitter.txt', 'utf8').trim() : '';
              head = rc === '0' && !owner
                ? '## Submission checks: PASSED\n\nA maintainer still reviews this before it can merge.' + submitter
                : '## Submission checks: FAILED\n\nFix the items below and push to this PR. The checks run again on every push.'
                  + (owner ? '\n\n- ' + owner : submitter ? '\n\n' + submitter.trim() : '');
              details = '\n\n<details><summary>Validation output</summary>\n\n```\n' + output + '\n```\n\n</details>';
            }
            const body = marker + '\n' + head + details;
            const { owner, repo } = context.repo;
            const prNum = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number: prNum, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body });
            }

      # The required check is this job; these show what passed and what didn't at a glance.
      - name: Show each part as its own check
        if: always()
        uses: actions/github-script@v9
        env:
          IS_FORK: ${{ steps.shape.outputs.fork }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '';
            const shapeProblems = read('shape-problems.txt');
            const report = fs.existsSync('report.json') ? JSON.parse(read('report.json')) : {};
            const checks = [];
            const add = (name, conclusion, title, lines = []) => checks.push({ name, conclusion, title, lines });

            if (process.env.IS_FORK !== 'true') add('One submission file', 'neutral', 'Not checked: opened from a branch of this repo');
            else if (shapeProblems) add('One submission file', 'failure', 'The PR must add exactly one submission file', shapeProblems.split('\n'));
            else add('One submission file', 'success', 'Adds one submission file');

            const ownerProblem = read('owner-problems.txt'), submitter = read('submitter.txt');
            if (shapeProblems) add('Submitter works on the mod', 'skipped', 'Skipped');
            else if (ownerProblem) add('Submitter works on the mod', 'failure', 'Not someone who works on the mod', [ownerProblem]);
            else if (process.env.IS_FORK !== 'true') add('Submitter works on the mod', 'neutral', 'Not checked: opened from a branch of this repo', [submitter]);
            else add('Submitter works on the mod', 'success', submitter || 'Checked');

            const names = { 'replacements.json': 'replacements.json is valid' };
            const conclusion = { pass: 'success', fail: 'failure', skipped: 'skipped' };
            for (const part of ['replacements.json', 'Manifest rules', 'Dependencies and libraries', 'Files match their hashes', 'VirusTotal scan', 'Icons']) {
              const r = report[part] || { status: 'skipped', errors: [], notes: [] };
              const title = r.status === 'fail' ? `${r.errors.length} problem${r.errors.length === 1 ? '' : 's'}` : r.status === 'pass' ? 'Passed' : 'Skipped';
              add(names[part] || part, conclusion[r.status], title, [...r.errors.map((e) => 'FAIL ' + e), ...r.notes.map((n) => 'note ' + n)]);
            }

            const { owner, repo } = context.repo;
            const head_sha = context.payload.pull_request.head.sha;
            for (const c of checks) {
              const summary = c.lines.filter(Boolean).map((l) => '- ' + l.replace(/`/g, "'")).join('\n') || c.title;
              await github.rest.checks.create({ owner, repo, name: c.name, head_sha, status: 'completed', conclusion: c.conclusion,
                output: { title: c.title.slice(0, 250), summary: summary.slice(0, 60000) } });
            }

      - name: Fail the check if anything failed
        if: always()
        run: |
          [ "${{ steps.shape.outputs.ok }}" = "true" ] || { echo "Single-file submission gate failed."; exit 1; }
          [ "${{ steps.owner.outputs.ok }}" != "false" ] || { echo "Submitter check failed."; exit 1; }
          [ "${{ steps.validate.outputs.rc }}" = "0" ] || { echo "Validation failed."; exit 1; }
